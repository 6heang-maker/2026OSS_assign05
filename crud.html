<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Management</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eeeeee;
            padding: 25px;
        }

        h1 {
            color: darkblue;
        }

        form {
            background-color: white;
            width: 450px;
            padding: 20px;
            border: 2px solid gray;
            margin-bottom: 30px;
        }

        input, select {
            padding: 6px;
            margin: 3px;
        }

        button {
            padding: 7px;
            margin: 3px;
            background-color: lightgray;
        }

        button:hover {
            background-color: yellow;
        }

        table {
            width: 95%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: lightblue;
            padding: 8px;
        }

        td {
            padding: 8px;
            text-align: center;
        }
    </style>

    <script>
        window.addEventListener("load", function(){

            const form = document.querySelector("#friendForm");
            const name = document.querySelector("#name");
            const age = document.querySelector("#age");
            const phone = document.querySelector("#phone");
            const email = document.querySelector("#email");
            const group = document.querySelector("#group");
            const saveBtn = document.querySelector("#saveBtn");
            const friendList = document.querySelector("#friendList");


            let friends = [
                {
                    id: 1,
                    name: "동하",
                    age: 25,
                    phone: "010-1111-1111",
                    email: "kim@handong.ac.kr",
                    group: "School"
                },
                {
                    id: 2,
                    name: "온유",
                    age: 25,
                    phone: "010-2222-2222",
                    email: "lee@handong.ac.kr",
                    group: "School"
                },
                {
                    id: 3,
                    name: "예준",
                    age: 23,
                    phone: "010-3333-3333",
                    email: "park@handong.ac.kr",
                    group: "School"
                },
                {
                    id: 4,
                    name: "지원",
                    age: 24,
                    phone: "010-4444-4444",
                    email: "kim@handong.ac.kr",
                    group: "School"
                }
            ];

            let nextId = 5;
            let editIndex = -1;


            function render(){

                friendList.innerHTML = "";

                for(let i = 0; i < friends.length; i++){

                    const tr = document.createElement("tr");

                    const td1 = document.createElement("td");
                    td1.textContent = friends[i].id;

                    const td2 = document.createElement("td");
                    td2.textContent = friends[i].name;

                    const td3 = document.createElement("td");
                    td3.textContent = friends[i].age;

                    const td4 = document.createElement("td");
                    td4.textContent = friends[i].phone;

                    const td5 = document.createElement("td");
                    td5.textContent = friends[i].email;

                    const td6 = document.createElement("td");
                    td6.textContent = friends[i].group;

                    const td7 = document.createElement("td");


                    const editBtn = document.createElement("button");
                    editBtn.textContent = "수정";

                    editBtn.addEventListener("click", function(){
                        edit(i);
                    });

                    td7.appendChild(editBtn);


                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "삭제";

                    deleteBtn.addEventListener("click", function(){
                        deleteFriend(i);
                    });

                    td7.appendChild(deleteBtn);


                    tr.appendChild(td1);
                    tr.appendChild(td2);
                    tr.appendChild(td3);
                    tr.appendChild(td4);
                    tr.appendChild(td5);
                    tr.appendChild(td6);
                    tr.appendChild(td7);

                    friendList.appendChild(tr);
                }
            }


            function edit(i){

                name.value = friends[i].name;
                age.value = friends[i].age;
                phone.value = friends[i].phone;
                email.value = friends[i].email;
                group.value = friends[i].group;

                editIndex = i;

                saveBtn.textContent = "Save";
            }


            function deleteFriend(i){
                const check = confirm("삭제하시나요?");
                if(check === true){

                    friends.splice(i, 1);
                    render();
                }
            }


            form.addEventListener("submit", function(e){

                e.preventDefault();


                if(name.value === ""){
                    alert("이름 입력.");
                    return;
                }

                if(age.value === ""){
                    alert("나이 입력.");
                    return;
                }

                if(age.value < 1 || age.value > 100){
                    alert("나이 재입력.");
                    return;
                }

                if(phone.value === ""){
                    alert("전화번호 입력.");
                    return;
                }

                if(email.value === ""){
                    alert("이메일 입력.");
                    return;
                }

                if(email.value.indexOf("@") === -1){
                    alert("이메일 재입력.");
                    return;
                }

                if(group.value === ""){
                    alert("관계 지정.");
                    return;
                }


                if(editIndex === -1){

                    const newFriend = {
                        id: nextId,
                        name: name.value,
                        age: age.value,
                        phone: phone.value,
                        email: email.value,
                        group: group.value
                    };

                    friends.push(newFriend);

                    nextId = nextId + 1;

                }

                else {

                    friends[editIndex].name = name.value;
                    friends[editIndex].age = age.value;
                    friends[editIndex].phone = phone.value;
                    friends[editIndex].email = email.value;
                    friends[editIndex].group = group.value;
                    editIndex = -1;

                    saveBtn.textContent = "Add";
                }


                name.value = "";
                age.value = "";
                phone.value = "";
                email.value = "";
                group.value = "";


                render();

            });


            render();

        });
    </script>

</head>

<body>

    <h1>Friend Management</h1>

    <form id="friendForm">

        <p>
            Name
            <input type="text" id="name">
        </p>

        <p>
            Age
            <input type="number" id="age">
        </p>

        <p>
            Phone
            <input type="text" id="phone">
        </p>

        <p>
            Email
            <input type="email" id="email">
        </p>

        <p>
            Group
            <select id="group">
                <option value="">Select</option>
                <option value="School">School</option>
                <option value="Church">Church</option>
                <option value="Family">Family</option>
                <option value="Other">Other</option>
            </select>
        </p>

        <button type="submit" id="saveBtn">Add</button>

    </form>

    <hr>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Group</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="friendList">

        </tbody>

    </table>

</body>
</html>
